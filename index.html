<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ASR Price List & Quote</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100dvh;overflow:hidden;font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;background:#f2f2f7}
body{display:flex;flex-direction:column}
.view{display:none;flex:1;flex-direction:column;overflow:hidden;min-height:0}.view.on{display:flex}
.hero{background:linear-gradient(135deg,#b45309,#d97706);padding:max(env(safe-area-inset-top),14px) 16px 10px;color:#fff;flex-shrink:0}
.hero h1{font-size:18px;font-weight:800;margin:0 0 2px}.hero p{font-size:11px;opacity:.8;margin:0}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.hero-btns{display:flex;gap:6px}
.hb{background:rgba(255,255,255,.2);border:none;border-radius:10px;padding:8px 10px;color:#fff;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap}
.search-wrap{position:relative;margin-top:10px}
.search{width:100%;padding:10px 12px;border-radius:10px;border:none;font-size:13px;font-family:inherit;outline:none;background:rgba(255,255,255,.95);color:#1c1c1e}
.suggest{position:absolute;top:100%;left:0;right:0;background:#fff;border-radius:0 0 10px 10px;box-shadow:0 8px 24px rgba(0,0,0,.15);max-height:200px;overflow-y:auto;z-index:100;display:none}
.suggest.on{display:block}
.sug-item{padding:10px 14px;font-size:12px;font-weight:600;color:#1c1c1e;border-bottom:1px solid #f5f5f5;cursor:pointer}
.sug-item:active{background:#fef3c7}
.sug-item .sc{font-size:10px;color:#888;font-weight:500}
.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#f2f2f7}
.cat-hdr{padding:8px 16px 6px;font-size:10px;font-weight:800;color:#92400e;background:#fef3c7;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.cat-hdr .ce{font-size:9px;color:#b45309;font-weight:600;opacity:.7}
.item-row{display:flex;align-items:center;padding:10px 16px;background:#fff;border-bottom:1px solid #f5f5f5;gap:6px}
.item-info{flex:1;min-width:0}
.item-name{font-size:12px;font-weight:700;color:#1c1c1e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-price{font-size:11px;color:#888;margin-top:1px;cursor:pointer;display:inline}
.item-price:active{color:#d97706}
.qi{width:44px;height:30px;border-radius:8px;border:2px solid #e5e5ea;text-align:center;font-size:13px;font-weight:700;font-family:inherit;color:#1c1c1e;outline:none;-webkit-appearance:none;-moz-appearance:textfield;flex-shrink:0}
.qi:focus{border-color:#d97706}
.ab{width:30px;height:30px;border-radius:50%;border:none;background:#d97706;color:#fff;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.db{width:26px;height:26px;border-radius:50%;border:none;background:#fee2e2;color:#dc2626;font-size:10px;font-weight:800;cursor:pointer;font-family:inherit;flex-shrink:0;display:flex;align-items:center;justify-content:center}
/* Add to cat */
.add-row{background:#fffbeb;border-bottom:2px solid #fef3c7}
.add-hdr{padding:8px 16px 6px;font-size:10px;font-weight:800;color:#fff;background:#d97706;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;justify-content:space-between}
.add-body{padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px}
.ai{width:100%;padding:10px 12px;border:2px solid #e5e5ea;border-radius:10px;font-size:13px;font-weight:600;font-family:inherit;outline:none;color:#1c1c1e;background:#fff}
.ai:focus{border-color:#d97706}
.add-fields{display:flex;gap:6px;align-items:center}
.pw{position:relative;flex:1}.pw span{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;font-weight:700;color:#999;pointer-events:none}
.pi{width:100%;padding:10px 10px 10px 24px;border:2px solid #e5e5ea;border-radius:10px;font-size:14px;font-weight:700;font-family:inherit;outline:none;color:#1c1c1e;background:#fff}
.pi:focus{border-color:#d97706}
.us{padding:10px;border:2px solid #e5e5ea;border-radius:10px;font-size:13px;font-weight:700;font-family:inherit;color:#1c1c1e;background:#fff;outline:none;cursor:pointer;flex-shrink:0}
.cs{padding:10px;border:2px solid #e5e5ea;border-radius:10px;font-size:12px;font-weight:700;font-family:inherit;color:#1c1c1e;background:#fff;outline:none;cursor:pointer;flex:1;max-width:50%}
.abtn{height:42px;padding:0 14px;border-radius:10px;border:none;background:#d97706;color:#fff;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;flex-shrink:0;white-space:nowrap}
/* Cart */
.cart-hdr{background:linear-gradient(135deg,#b45309,#d97706);padding:14px 16px 10px;color:#fff;display:flex;align-items:center;gap:10px;flex-shrink:0}
.cart-hdr h2{font-size:18px;font-weight:800;margin:0;flex:1}
.bb{background:rgba(255,255,255,.2);border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;color:#fff;font-family:inherit}
.cb{background:rgba(255,255,255,.15);border:none;border-radius:8px;padding:6px 10px;color:#fff;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
.cart-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#f2f2f7;padding-bottom:80px}
.summary{margin:0 14px 14px;background:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.qw{display:flex;align-items:center;gap:4px;flex-shrink:0}
.qb{width:26px;height:26px;border-radius:50%;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center}
.qd{border:1px solid #e5e5ea;background:#f5f5f5;color:#1c1c1e}.qp{border:none;background:#d97706;color:#fff}
.cqi{width:48px;height:28px;border-radius:6px;border:2px solid #e5e5ea;text-align:center;font-size:13px;font-weight:800;font-family:inherit;color:#1c1c1e;outline:none;-webkit-appearance:none;-moz-appearance:textfield}
.cqi:focus{border-color:#d97706}
/* Edit modal */
.emo{position:fixed;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(3px)}
.emc{background:#fff;border-radius:14px;padding:20px;width:min(300px,88vw);box-shadow:0 20px 60px rgba(0,0,0,.15)}
.emc h3{font-size:14px;font-weight:700;color:#222;margin:0 0 12px}
.emc label{font-size:11px;font-weight:700;color:#666;display:block;margin-bottom:4px}
.emi{width:100%;padding:12px;font-size:16px;font-weight:700;font-family:inherit;border:2px solid #e5e5ea;border-radius:10px;outline:none;color:#222;margin-bottom:10px}
.emi:focus{border-color:#d97706}
.emb{display:flex;gap:8px;margin-top:4px}
.emb button{flex:1;padding:11px;border:none;border-radius:10px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer}
/* Settings */
.set-hdr{background:linear-gradient(135deg,#374151,#1f2937);padding:max(env(safe-area-inset-top),14px) 16px 14px;color:#fff;display:flex;align-items:center;gap:10px;flex-shrink:0}
.set-hdr h2{font-size:18px;font-weight:800;margin:0;flex:1}
.set-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#f2f2f7;padding:16px}
.set-card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:12px}
.set-card h3{font-size:14px;font-weight:800;color:#1c1c1e;margin:0 0 4px}
.set-card p{font-size:11px;color:#888;line-height:1.5;margin:0 0 14px}
.si{width:100%;padding:10px 12px;border:2px solid #e5e5ea;border-radius:10px;font-size:13px;font-weight:600;font-family:inherit;outline:none;color:#1c1c1e;margin-bottom:10px}
.si:focus{border-color:#6366f1}
.sbtn{width:100%;padding:12px;border:none;border-radius:10px;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer;margin-bottom:8px}
</style>
</head>
<body>

<!-- ═══ PRICE LIST ═══ -->
<div id="priceView" class="view on">
  <div class="hero">
    <div class="hero-row">
      <div><h1>ASR Price List</h1><p id="syncStatus">Tap qty + add to cart</p></div>
      <div class="hero-btns">
        <button class="hb" onclick="openTM()">📋 T&M</button>
        <button class="hb" onclick="openSettings()">⚙️</button>
        <button class="hb" id="cartBtn" onclick="showCart()">🛒 <span id="cartCount">0</span></button>
      </div>
    </div>
    <div class="search-wrap">
      <input class="search" id="priceSearch" type="text" placeholder="Search fittings, pipe, valves…" oninput="onSearch()" onfocus="onSearch()" onblur="setTimeout(()=>closeSuggest(),200)">
      <div class="suggest" id="suggestBox"></div>
    </div>
  </div>
  <div class="list">
    <div class="add-row">
      <div class="add-hdr"><span>⭐ Add New Product</span></div>
      <div class="add-body">
        <input id="addName" class="ai" type="text" placeholder="Product name…" maxlength="80">
        <div class="add-fields">
          <div class="pw"><span>$</span><input id="addPrice" class="pi" type="number" min="0" step="0.01" placeholder="0.00"></div>
          <select id="addUnit" class="us"><option value="ea">ea</option><option value="ft">ft</option><option value="lot">lot</option><option value="hr">hr</option><option value="bag">bag</option><option value="job">job</option></select>
          <select id="addCat" class="cs"></select>
          <button class="abtn" onclick="addProduct()">+ Add</button>
        </div>
      </div>
    </div>
    <div id="priceListEl"></div>
  </div>
</div>

<!-- ═══ CART ═══ -->
<div id="cartView" class="view">
  <div class="cart-hdr">
    <button class="bb" onclick="showList()">←</button>
    <h2>Cart / Quote</h2>
    <button class="cb" style="background:rgba(255,255,255,.35)" onclick="showQuote()">📄 Quote</button>
    <button class="cb" onclick="clearCart()">Clear</button>
  </div>
  <div class="cart-scroll">
    <div id="cartItems"></div>
    <div id="cartTotal" class="summary"></div>
  </div>
</div>

<!-- ═══ SETTINGS ═══ -->
<div id="settingsView" class="view">
  <div class="set-hdr"><button class="bb" onclick="closeSettings()">←</button><h2>Sync Settings</h2></div>
  <div class="set-scroll">
    <div class="set-card"><h3>☁️ GitHub Sync</h3><p>Share products between devices via GitHub.</p>
      <label>GitHub Username / Org</label><input id="ghOwner" class="si" type="text" placeholder="e.g. mycompany">
      <label>Repository Name</label><input id="ghRepo" class="si" type="text" placeholder="e.g. asr-pricing">
      <label>Personal Access Token</label><input id="ghToken" class="si" type="password" placeholder="ghp_xxxxxxxxxxxx">
      <button class="sbtn" style="background:#4f46e5;color:#fff" onclick="saveGH()">Save & Sync</button>
      <button class="sbtn" style="background:#f2f2f7;color:#4f46e5" onclick="testSync()">Test Connection</button>
      <div id="ghStatus" style="margin-top:8px;font-size:11px;color:#888;text-align:center;min-height:18px"></div>
    </div>
    <div class="set-card"><h3>🗑 Reset</h3>
      <button class="sbtn" style="background:#fee2e2;color:#dc2626" onclick="resetAll()">Clear All Custom Products</button>
    </div>
  </div>
</div>

<!-- ═══ EDIT MODAL ═══ -->
<div id="editModal" class="emo" style="display:none" onpointerdown="closeEditModal()">
  <div class="emc" onpointerdown="event.stopPropagation()">
    <h3 id="emTitle">Edit</h3>
    <label id="emLabel1">Name</label><input id="emName" class="emi" type="text">
    <label>Price</label><input id="emPrice" class="emi" type="number" step="0.01" min="0">
    <label>Unit</label>
    <select id="emUnit" class="emi" style="font-size:14px"><option value="ea">ea</option><option value="ft">ft</option><option value="lot">lot</option><option value="hr">hr</option><option value="bag">bag</option><option value="job">job</option></select>
    <label>Category</label><input id="emCat" class="emi" type="text">
    <div class="emb">
      <button style="background:#f5f5f5;color:#666" onclick="closeEditModal()">Cancel</button>
      <button style="background:#222;color:#fff" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<!-- ═══ RENAME CAT MODAL ═══ -->
<div id="renameModal" class="emo" style="display:none" onpointerdown="closeRename()">
  <div class="emc" onpointerdown="event.stopPropagation()">
    <h3>Rename Category</h3>
    <label>Category Name</label><input id="rmName" class="emi" type="text">
    <div class="emb">
      <button style="background:#f5f5f5;color:#666" onclick="closeRename()">Cancel</button>
      <button style="background:#222;color:#fff" onclick="saveRename()">Rename</button>
    </div>
  </div>
</div>

<!-- ═══ CUSTOMER QUOTE ═══ -->
<div id="quoteView" class="view">
  <div style="background:#fff;padding:12px 16px;border-bottom:1px solid #e5e5ea;display:flex;align-items:center;gap:10px;flex-shrink:0">
    <button onclick="closeQuote()" style="background:#f2f2f7;border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;font-family:inherit;color:#1c1c1e">←</button>
    <span style="flex:1;font-size:16px;font-weight:800;color:#1c1c1e">Customer Quote</span>
    <button onclick="shareQuote()" style="background:#0055d4;border:none;border-radius:8px;padding:8px 12px;color:#fff;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">📋 Copy</button>
  </div>
  <div id="quoteContent" style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#fff"></div>
</div>

<!-- ═══ T&M EDITOR ═══ -->
<div id="tmView" class="view">
  <div style="background:linear-gradient(135deg,#1e3a5f,#1e40af);padding:max(env(safe-area-inset-top),14px) 16px 14px;color:#fff;display:flex;align-items:center;gap:10px;flex-shrink:0">
    <button onclick="closeTM()" style="background:rgba(255,255,255,.2);border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;color:#fff;font-family:inherit">←</button>
    <h2 style="font-size:18px;font-weight:800;margin:0;flex:1">Time & Materials</h2>
    <button onclick="showTMPreview()" style="background:rgba(255,255,255,.3);border:none;border-radius:8px;padding:8px 12px;color:#fff;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">👁 Preview</button>
  </div>
  <div style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#f2f2f7;padding:16px;padding-bottom:100px">
    <!-- Customer info -->
    <div style="background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:12px">
      <div style="font-size:10px;font-weight:800;color:#1e3a5f;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Customer Info</div>
      <input id="tmCustomer" type="text" placeholder="Customer name" style="width:100%;padding:12px;border:2px solid #e5e5ea;border-radius:10px;font-size:15px;font-weight:700;font-family:inherit;outline:none;color:#1c1c1e;margin-bottom:8px" onfocus="this.style.borderColor='#1e40af'" onblur="this.style.borderColor='#e5e5ea';saveTM()">
      <div style="display:flex;gap:8px">
        <input id="tmDateStart" type="date" style="flex:1;padding:10px;border:2px solid #e5e5ea;border-radius:10px;font-size:13px;font-weight:600;font-family:inherit;outline:none;color:#1c1c1e" onchange="saveTM()">
        <input id="tmDateEnd" type="date" style="flex:1;padding:10px;border:2px solid #e5e5ea;border-radius:10px;font-size:13px;font-weight:600;font-family:inherit;outline:none;color:#1c1c1e" onchange="saveTM()">
      </div>
    </div>

    <!-- Projects -->
    <div id="tmProjects"></div>

    <!-- Add project button -->
    <button onclick="addTMProject()" style="width:100%;padding:14px;border:2px dashed #cbd5e1;border-radius:14px;background:transparent;color:#1e40af;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:12px">+ Add Project</button>
  </div>
</div>

<!-- ═══ T&M CUSTOMER PREVIEW ═══ -->
<div id="tmPreview" class="view">
  <div style="background:#fff;padding:12px 16px;border-bottom:1px solid #e5e5ea;display:flex;align-items:center;gap:10px;flex-shrink:0">
    <button onclick="closeTMPreview()" style="background:#f2f2f7;border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;font-family:inherit;color:#1c1c1e">←</button>
    <span style="flex:1;font-size:16px;font-weight:800;color:#1c1c1e">Customer T&M Sheet</span>
    <button onclick="shareTM()" style="background:#1e40af;border:none;border-radius:8px;padding:8px 12px;color:#fff;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">📋 Copy</button>
  </div>
  <div id="tmPreviewContent" style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#fff"></div>
</div>

// Get effective item (with edits applied)
function getItem(idx) {
  const base = PRICE_DATA[idx];
  if (!base) return null;
  const ed = priceEdits[idx];
  if (ed?.deleted) return null;
  return { ...base, ...(ed || {}), idx };
}

// All categories
function getCats() {
  const cats = new Set();
  PRICE_DATA.forEach((item, i) => { const it = getItem(i); if (it) cats.add(it.cat); });
  return [...cats];
}

// ── Search with auto-suggest ──
function onSearch() {
  const q = document.getElementById('priceSearch').value.toLowerCase().trim();
  renderPriceList();
  const box = document.getElementById('suggestBox');
  if (q.length < 2) { box.classList.remove('on'); return; }
  const matches = [];
  PRICE_DATA.forEach((item, i) => {
    const it = getItem(i);
    if (!it) return;
    if (it.name.toLowerCase().includes(q) || it.cat.toLowerCase().includes(q)) matches.push(it);
  });
  if (!matches.length) { box.classList.remove('on'); return; }
  box.innerHTML = '';
  matches.slice(0, 8).forEach(m => {
    const d = document.createElement('div'); d.className = 'sug-item';
    d.innerHTML = `${m.name} <span class="sc">· $${m.price.toFixed(2)}/${m.unit} · ${m.cat}</span>`;
    d.onpointerdown = (e) => { e.preventDefault(); document.getElementById('priceSearch').value = m.name; closeSuggest(); renderPriceList(); };
    box.appendChild(d);
  });
  box.classList.add('on');
}
function closeSuggest() { document.getElementById('suggestBox').classList.remove('on'); }

// ── Populate category dropdown ──
function populateCatDropdown() {
  const sel = document.getElementById('addCat');
  const cats = getCats();
  sel.innerHTML = '';
  cats.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); });
  const o = document.createElement('option'); o.value = '__new__'; o.textContent = '+ New Category…'; sel.appendChild(o);
}

// ── Add product ──
function addProduct() {
  const name = document.getElementById('addName').value.trim();
  const price = parseFloat(document.getElementById('addPrice').value);
  const unit = document.getElementById('addUnit').value;
  let cat = document.getElementById('addCat').value;
  if (!name) { document.getElementById('addName').style.borderColor='#ef4444'; setTimeout(()=>document.getElementById('addName').style.borderColor='#e5e5ea',1800); return; }
  if (isNaN(price) || price < 0) { document.getElementById('addPrice').style.borderColor='#ef4444'; setTimeout(()=>document.getElementById('addPrice').style.borderColor='#e5e5ea',1800); return; }
  if (cat === '__new__') { cat = prompt('New category name:'); if (!cat) return; }
  const p = { cat, name, unit, price };
  userProducts.push(p);
  const idx = PRICE_DATA.length;
  PRICE_DATA.push({ ...p, idx });
  saveUserProducts();
  pushToGitHub(p);
  // Add to cart
  cart.push({ idx, name, cat, unit, price, qty: 1 });
  saveState(); updateCartBadge();
  document.getElementById('addName').value = ''; document.getElementById('addPrice').value = '';
  populateCatDropdown(); renderPriceList();
  const btn = document.querySelector('.abtn');
  if (btn) { btn.textContent='✓'; btn.style.background='#059669'; setTimeout(()=>{btn.textContent='+ Add';btn.style.background='#d97706'},800); }
}

// ── Edit item ──
function openEdit(idx) {
  editIdx = idx;
  const item = getItem(idx);
  if (!item) return;
  document.getElementById('emTitle').textContent = 'Edit: ' + item.name;
  document.getElementById('emName').value = item.name;
  document.getElementById('emPrice').value = item.price;
  document.getElementById('emUnit').value = item.unit;
  document.getElementById('emCat').value = item.cat;
  document.getElementById('editModal').style.display = '';
  setTimeout(() => document.getElementById('emPrice').focus(), 50);
}
function closeEditModal() { document.getElementById('editModal').style.display = 'none'; editIdx = null; }
function saveEdit() {
  if (editIdx === null) return;
  const name = document.getElementById('emName').value.trim();
  const price = parseFloat(document.getElementById('emPrice').value);
  const unit = document.getElementById('emUnit').value;
  const cat = document.getElementById('emCat').value.trim();
  if (!name || isNaN(price)) return;
  priceEdits[editIdx] = { name, price, unit, cat };
  saveEdits();
  // Update cart items too
  cart.forEach(c => { if (c.idx === editIdx) { c.name = name; c.price = price; c.unit = unit; c.cat = cat; } });
  saveState();
  closeEditModal(); populateCatDropdown(); renderPriceList();
}

// ── Delete item ──
function deleteItem(idx) {
  if (!confirm('Delete this item?')) return;
  priceEdits[idx] = { ...(priceEdits[idx]||{}), deleted: true };
  saveEdits();
  cart = cart.filter(c => c.idx !== idx);
  saveState(); updateCartBadge(); renderPriceList();
}

// ── Rename category ──
function openRename(cat) {
  renameCat = cat;
  document.getElementById('rmName').value = cat;
  document.getElementById('renameModal').style.display = '';
  setTimeout(() => { document.getElementById('rmName').focus(); document.getElementById('rmName').select(); }, 50);
}
function closeRename() { document.getElementById('renameModal').style.display = 'none'; renameCat = null; }
function saveRename() {
  const newName = document.getElementById('rmName').value.trim();
  if (!newName || !renameCat) return;
  // Update all items in this category
  PRICE_DATA.forEach((item, i) => {
    const it = getItem(i);
    if (it && it.cat === renameCat) {
      if (!priceEdits[i]) priceEdits[i] = {};
      priceEdits[i].cat = newName;
    }
  });
  // Update cart
  cart.forEach(c => { if (c.cat === renameCat) c.cat = newName; });
  saveEdits(); saveState();
  closeRename(); populateCatDropdown(); renderPriceList();
}

// ── Cart ──
function addToCart(idx) {
  const item = getItem(idx);
  if (!item) return;
  const addQty = parseInt(document.getElementById('pq-'+idx)?.value) || 1;
  const existing = cart.find(c => c.idx === idx);
  if (existing) existing.qty += addQty;
  else cart.push({ idx, name: item.name, cat: item.cat, unit: item.unit, price: item.price, qty: addQty });
  saveState(); updateCartBadge();
  const qe = document.getElementById('pq-'+idx); if (qe) qe.value = '1';
  const el = document.getElementById('pa-'+idx);
  if (el) { el.textContent='✓'; el.style.background='#059669'; setTimeout(()=>{el.textContent='+';el.style.background='#d97706'},700); }
}
function removeFromCart(idx) { cart = cart.filter(c => c.idx !== idx); saveState(); updateCartBadge(); renderCart(); }
function clearCart() { if (confirm('Clear cart?')) { cart = []; saveState(); updateCartBadge(); renderCart(); } }
function updateCartBadge() { const t = cart.reduce((s,c) => s+c.qty, 0); document.getElementById('cartCount').textContent = t; }

// ── Render Price List ──
function renderPriceList() {
  const q = (document.getElementById('priceSearch')?.value||'').toLowerCase().trim();
  const el = document.getElementById('priceListEl');
  if (!el) return;
  const cats = {};
  PRICE_DATA.forEach((item, i) => {
    const it = getItem(i);
    if (!it) return;
    if (q && !it.name.toLowerCase().includes(q) && !it.cat.toLowerCase().includes(q)) return;
    if (!cats[it.cat]) cats[it.cat] = [];
    cats[it.cat].push(it);
  });
  if (!Object.keys(cats).length) { el.innerHTML = '<div style="padding:32px;text-align:center;color:#aaa;font-size:13px;font-weight:600">No results</div>'; return; }
  el.innerHTML = '';
  Object.entries(cats).forEach(([cat, items]) => {
    const sec = document.createElement('div');
    const hdr = document.createElement('div'); hdr.className = 'cat-hdr';
    hdr.innerHTML = cat + ' <span class="ce">✏️ tap to rename</span>';
    hdr.onclick = () => openRename(cat);
    sec.appendChild(hdr);
    items.forEach(item => {
      const row = document.createElement('div'); row.className = 'item-row';
      const dl = document.createElement('button'); dl.className = 'db'; dl.textContent = '✕'; dl.onclick = () => deleteItem(item.idx);
      const info = document.createElement('div'); info.className = 'item-info';
      const nm = document.createElement('div'); nm.className = 'item-name'; nm.textContent = item.name;
      const pr = document.createElement('div'); pr.className = 'item-price';
      pr.textContent = '$' + item.price.toFixed(2) + ' / ' + item.unit + '  ✏️';
      pr.onclick = () => openEdit(item.idx);
      info.appendChild(nm); info.appendChild(pr);
      const qi = document.createElement('input'); qi.id = 'pq-'+item.idx; qi.className = 'qi';
      qi.type='number'; qi.inputMode='numeric'; qi.min='1'; qi.value='1';
      qi.onfocus = function(){ this.style.borderColor='#d97706'; this.select(); };
      qi.onblur = function(){ this.style.borderColor='#e5e5ea'; };
      qi.onkeydown = function(e){ if(e.key==='Enter'){ addToCart(item.idx); this.blur(); } };
      const ab = document.createElement('button'); ab.id = 'pa-'+item.idx; ab.className = 'ab'; ab.textContent = '+'; ab.onclick = () => addToCart(item.idx);
      row.appendChild(dl); row.appendChild(info); row.appendChild(qi); row.appendChild(ab);
      sec.appendChild(row);
    });
    el.appendChild(sec);
  });
}

// ── Render Cart ──
function renderCart() {
  const el = document.getElementById('cartItems'), totEl = document.getElementById('cartTotal');
  if (!el) return;
  if (!cart.length) { el.innerHTML = '<div style="padding:40px;text-align:center;color:#aaa;font-size:13px;font-weight:600">Cart is empty</div>'; totEl.innerHTML=''; return; }
  const cats = {}; cart.forEach(c => { if (!cats[c.cat]) cats[c.cat]=[]; cats[c.cat].push(c); });
  el.innerHTML = ''; let grandTotal = 0;
  Object.entries(cats).forEach(([cat, items]) => {
    const sec = document.createElement('div'); sec.style.cssText='margin:14px 14px 0';
    const hdr = document.createElement('div'); hdr.style.cssText='font-size:10px;font-weight:800;color:#92400e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px'; hdr.textContent=cat; sec.appendChild(hdr);
    const card = document.createElement('div'); card.style.cssText='background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)';
    items.forEach(item => {
      const lt = item.price * item.qty; grandTotal += lt;
      const row = document.createElement('div'); row.style.cssText='display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid #f5f5f5;gap:8px';

      const info = document.createElement('div'); info.style.cssText='flex:1;min-width:0';

  const grandTotal = totalMat + totalLabor;

  let text = `ASR PLUMBING\nTime & Materials Summary\n`;
  text += `Customer: ${tmData.customer || 'N/A'}\n`;
  text += `Date: ${formatTMDates()}\n`;
  text += `${'─'.repeat(32)}\n\n`;

  tmData.projects.forEach(p => {
    const m = parseFloat(p.materials) || 0;
    const h = parseFloat(p.laborHours) || 0;
    const r = parseFloat(p.laborRate) || 225;
    const l = h * r;
    text += `${p.name || 'Project'}\n  Materials: $${m.toFixed(2)} · Labor: $${l.toFixed(2)} (${h} hrs)\n  Subtotal: $${(m+l).toFixed(2)}\n\n`;
  });

  text += `${'─'.repeat(32)}\n`;
  text += `Total Materials: $${totalMat.toFixed(2)}\n`;
  text += `Total Labor: $${totalLabor.toFixed(2)} (${totalHrs} hrs)\n`;
  text += `${'─'.repeat(32)}\n`;
  text += `GRAND TOTAL: $${grandTotal.toFixed(2)}\n\nThank you for choosing ASR Plumbing.`;

  if (navigator.share) {
    navigator.share({ title: 'ASR T&M', text }).catch(() => { navigator.clipboard?.writeText(text); alert('Copied!'); });
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => alert('Copied!'));
  } else {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); alert('Copied!');
  }
}

// ── Init ──
populateCatDropdown();
renderPriceList();
updateCartBadge();
fetchShared();
</script>
</body>
